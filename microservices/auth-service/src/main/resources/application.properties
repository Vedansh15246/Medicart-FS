# Application Configuration
spring.application.name=auth-service
spring.profiles.active=dev

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/auth_service_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
e

# JWT Configuration
jwt.secret=your-secret-key-min-256-bits-long-for-hs256-algorithm-medicart
jwt.expiration=3600000

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Server Configuration
server.port=8081
server.servlet.context-path=/

# Logging Configuration
logging.level.root=INFO
logging.level.com.medicart=DEBUG
 
# Multipart upload limits - make sure this is >= controller's 5MB check
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

# Springdoc OpenAPI (Swagger) Configuration
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# NOTE:
# The above springdoc properties make this service expose OpenAPI JSON at
# /v3/api-docs and the swagger UI at /swagger-ui.html. The API Gateway's
# aggregator calls this /v3/api-docs endpoint when building the combined
# documentation. Do not disable api-docs when running behind the gateway.
