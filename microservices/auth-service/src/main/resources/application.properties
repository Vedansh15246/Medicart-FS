# ========================================
# MEDICART AUTH SERVICE CONFIGURATION
# ========================================
# This file contains all settings for the Authentication Service
# which handles user registration, login, password management, and JWT tokens

# ========================================
# 1. APPLICATION SETTINGS
# ========================================
# Name of this microservice (used by Eureka for service discovery)
spring.application.name=auth-service

# Active profile (dev/prod) - controls which environment settings to use
spring.profiles.active=dev

# ========================================
# 2. DATABASE CONNECTION
# ========================================
# MySQL database connection URL
# - localhost:3306 = database server location and port
# - auth_service_db = name of the database
# - useSSL=false = disable SSL for local development
# - serverTimezone=UTC = set timezone to UTC
spring.datasource.url=jdbc:mysql://localhost:3306/auth_service_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Database username and password
spring.datasource.username=root
spring.datasource.password=root

# MySQL driver class (tells Spring how to connect to MySQL)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================
# 3. JPA/HIBERNATE SETTINGS
# ========================================
# Auto-create/update database tables based on Java entity classes
# - update = automatically create or modify tables when app starts
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console (false = don't show, true = show)
spring.jpa.show-sql=false

# Use MySQL 8 dialect (tells Hibernate which MySQL version we're using)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Format SQL queries nicely in logs (makes them easier to read)
spring.jpa.properties.hibernate.format_sql=true

# ========================================
# 4. JWT (JSON Web Token) CONFIGURATION
# ========================================
# Secret key used to sign JWT tokens (must be at least 256 bits/32 characters)
# IMPORTANT: Change this in production!
jwt.secret=your-secret-key-min-256-bits-long-for-hs256-algorithm-medicart

# Token expiration time in milliseconds (3600000 = 1 hour)
jwt.expiration=3600000

# ========================================
# 5. EUREKA SERVICE DISCOVERY
# ========================================
# URL of Eureka server (service registry where all microservices register)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Use hostname instead of IP address for registration
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost

# Unique instance ID for this service
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ========================================
# 6. SERVER CONFIGURATION
# ========================================
# Port number where this service runs (8081)
server.port=8081

# Base URL path (/ means no prefix, service available at http://localhost:8081/)
server.servlet.context-path=/

# ========================================
# 7. LOGGING CONFIGURATION
# ========================================
# Log level for all packages (INFO = show important messages only)
logging.level.root=INFO

# Log level for our application (DEBUG = show detailed debug messages)
logging.level.com.medicart=DEBUG

# ========================================
# 8. FILE UPLOAD LIMITS
# ========================================
# Maximum file size for prescription uploads (6MB)
spring.servlet.multipart.max-file-size=6MB

# Maximum total request size (6MB)
spring.servlet.multipart.max-request-size=6MB

# ========================================
# 9. API DOCUMENTATION (SWAGGER)
# ========================================
# Enable OpenAPI documentation generation
springdoc.api-docs.enabled=true

# URL path for API documentation JSON (used by API Gateway)
springdoc.api-docs.path=/v3/api-docs

# Enable Swagger UI (interactive API documentation)
springdoc.swagger-ui.enabled=true

# URL path for Swagger UI web interface
springdoc.swagger-ui.path=/swagger-ui.html
