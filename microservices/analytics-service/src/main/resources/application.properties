spring.application.name=analytics-service
server.port=8085

# MySQL datasource for analytics-service
# Adjust credentials if your local DB uses different user/password
spring.datasource.url=jdbc:mysql://localhost:3306/analytics_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Eureka (service discovery)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Avoid running SQL init scripts too early
spring.sql.init.mode=never
spring.application.name=analytics-service
server.port=8085

spring.datasource.url=jdbc:mysql://localhost:3306/analytics_db
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

logging.level.com.medicart.analytics=INFO
logging.level.org.springframework.cloud.openfeign=DEBUG